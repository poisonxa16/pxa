name: ghcr

# Manual only. The published images for a release are built and gated on the bench hardware
# (the sm_60/sm_61/sm_70 smoke tests cannot run on a GitHub runner), then pushed by hand, so a
# tag push must NOT kick off a second, ungated build that would overwrite them.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish under (defaults to latest only)
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (CUDA image build needs headroom)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          REF_TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            REF_TAG="${{ github.event.inputs.tag }}"
          fi
          TAGS="${{ env.IMAGE }}:latest"
          if [ -n "$REF_TAG" ]; then
            TAGS="${{ env.IMAGE }}:${REF_TAG},${TAGS}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CUDA_ARCHS=60;61;70
            TAG=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
