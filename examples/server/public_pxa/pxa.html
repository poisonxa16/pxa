<!doctype html>
<!--
  PXA_EXPLAIN_PAGE_v1 (2026-09-25, showcase lane). Plain HTML+JS, no build toolchain, no external
  resources (it is embedded straight into the llama-server binary -- see the PXA_ASSETS block in
  examples/server/CMakeLists.txt and GET /pxa in server.cpp). It only ever reads GET /pxa/explain;
  it makes no other request, and nothing on this page can change a generated token.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PXA explains itself</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d10; --panel: #14171c; --border: #262b33; --text: #e6e9ef; --dim: #93a0b4;
    --accent: #5fb3ff; --good: #57d38c; --warn: #f2c14e; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 28px 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--dim); margin-bottom: 20px; font-size: 13px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .bar { height: 8px; border-radius: 5px; background: #232830; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.why { color: var(--dim); font-size: 12.5px; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    letter-spacing: .03em; text-transform: uppercase;
  }
  .pill.measured { background: rgba(87,211,140,.15); color: var(--good); }
  .pill.inferred, .pill.rule, .pill.adaptive { background: rgba(242,193,78,.15); color: var(--warn); }
  .pill.user, .pill.off { background: rgba(147,160,180,.15); color: var(--dim); }
  .lever-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lever { background: #1b1f26; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .lever.user { border-color: var(--accent); color: var(--accent); }
  .metric { text-align: center; }
  .metric .n { font-size: 26px; font-weight: 700; }
  .metric .label { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .err { color: var(--bad); }
  code { background: #1b1f26; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  footer { margin-top: 32px; color: var(--dim); font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>PXA explains itself</h1>
  <div class="sub" id="sub">loading &hellip;</div>
  <div class="sub"><a href="/pxa/speed">Speed history &rarr;</a> decode and prefill t/s over time, per model</div>

  <div id="err" class="err"></div>

  <h2>Cards</h2>
  <div class="grid" id="cards"></div>

  <h2>What it picked, and why</h2>
  <table id="picks-table">
    <thead><tr><th>flag</th><th>value</th><th>status</th><th>why</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Live</h2>
  <div class="grid" id="live"></div>

  <h2>Active levers</h2>
  <div class="card">
    <div class="row"><span id="lever-summary">&nbsp;</span></div>
    <div class="lever-list" id="lever-user"></div>
    <div class="lever-list" id="lever-default" style="margin-top:10px"></div>
  </div>

  <footer id="footer"></footer>

<script>
(function () {
  "use strict";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fmtNum(x, d) {
    if (x === null || x === undefined || isNaN(x)) return "–";
    return Number(x).toFixed(d === undefined ? 1 : d);
  }

  function statusPill(status) {
    var s = (status || "").toLowerCase();
    return el("span", "pill " + (s || "off"), status || "–");
  }

  function renderCards(cards) {
    var host = document.getElementById("cards");
    host.innerHTML = "";
    if (!cards || !cards.length) {
      host.appendChild(el("div", "card", "No CUDA devices reported by this build/boot."));
      return;
    }
    cards.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("h3", null, "card " + c.index + "  ·  " + (c.name || "?")));
      var pct = c.vram_total_mib ? Math.min(100, 100 * c.vram_used_mib / c.vram_total_mib) : 0;
      var bar = el("div", "bar");
      var fill = el("i");
      fill.style.width = pct.toFixed(1) + "%";
      bar.appendChild(fill);
      card.appendChild(bar);
      var row = el("div", "row");
      row.appendChild(el("span", null, "sm_" + c.sm));
      row.appendChild(el("span", null, fmtNum(c.vram_used_mib, 0) + " / " + fmtNum(c.vram_total_mib, 0) + " MiB used"));
      card.appendChild(row);
      var row2 = el("div", "row");
      row2.appendChild(el("span", null, "free"));
      row2.appendChild(el("span", null, fmtNum(c.vram_free_mib, 0) + " MiB"));
      card.appendChild(row2);
      host.appendChild(card);
    });
  }

  function renderPicks(picks) {
    var tbody = document.querySelector("#picks-table tbody");
    tbody.innerHTML = "";
    var order = ["sm", "b", "ub", "fa", "ngl", "c"];
    order.forEach(function (flag) {
      var p = (picks || {})[flag];
      if (!p) return;
      var tr = document.createElement("tr");
      var tdFlag = el("td", null, "-" + flag);
      var tdVal = el("td", null, p.value || "(yours)");
      var tdStatus = el("td");
      tdStatus.appendChild(statusPill(p.status));
      var tdWhy = el("td", "why", (p.why || "") + (p.evidence ? "  [" + p.evidence + "]" : ""));
      tr.appendChild(tdFlag); tr.appendChild(tdVal); tr.appendChild(tdStatus); tr.appendChild(tdWhy);
      tbody.appendChild(tr);
    });
    if (!tbody.children.length) {
      var tr = document.createElement("tr");
      var td = el("td", "why", "no picks reported (model not loaded, or every flag was set explicitly)");
      td.colSpan = 4;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function metricTile(n, label) {
    var c = el("div", "card metric");
    c.appendChild(el("div", "n", n));
    c.appendChild(el("div", "label", label));
    return c;
  }

  function renderLive(live) {
    var host = document.getElementById("live");
    host.innerHTML = "";
    if (!live) return;
    if (live.note) {
      host.appendChild(el("div", "card", live.note));
      return;
    }
    host.appendChild(metricTile(fmtNum(live.decode_tok_s, 1), "decode t/s (live window)"));
    host.appendChild(metricTile(fmtNum(live.prefill_tok_s, 1), "prefill t/s (live window)"));
    var spec = live.speculative || {};
    var acceptPct = spec.accept_rate !== undefined ? (spec.accept_rate * 100) : null;
    host.appendChild(metricTile(acceptPct === null ? "–" : fmtNum(acceptPct, 0) + "%",
                                 "speculation acceptance (" + fmtNum(spec.n_draft_accepted, 0) + "/" +
                                 fmtNum(spec.n_draft_total, 0) + " draft tok)"));
    host.appendChild(metricTile(fmtNum(live.requests_processing, 0) + " / " + fmtNum(live.requests_deferred, 0),
                                 "processing / deferred"));
  }

  function renderLevers(levers) {
    var summary = document.getElementById("lever-summary");
    var userHost = document.getElementById("lever-user");
    var defHost = document.getElementById("lever-default");
    userHost.innerHTML = ""; defHost.innerHTML = "";
    if (!levers) { summary.textContent = ""; return; }
    summary.textContent = levers.declared + " levers declared · " + levers.default_on_count +
      " default-on · " + (levers.user_set || []).length + " set by you in this environment";
    (levers.user_set || []).forEach(function (u) {
      var tag = el("span", "lever user", u.name + "=" + u.value + "  (default " + u["default"] + ")");
      userHost.appendChild(tag);
    });
    (levers.default_on || []).forEach(function (d) {
      var tag = el("span", "lever", d.name + "=" + d.value);
      defHost.appendChild(tag);
    });
  }

  function render(j) {
    var sub = "model " + (j.model_alias || (j.model && j.model.path) || "?") +
      "  ·  level " + (j.level || "?") +
      "  ·  engine build " + ((j.engine && j.engine.build) || "?") +
      " (" + ((j.engine && j.engine.commit) || "?") + ")";
    document.getElementById("sub").textContent = sub;
    document.getElementById("err").textContent = "";
    renderCards(j.cards);
    renderPicks(j.picks);
    renderLive(j.live);
    renderLevers(j.levers);
    document.getElementById("footer").innerHTML =
      "Raw JSON: <a href=\"/pxa/explain\">/pxa/explain</a> &middot; <a href=\"/pxa/speed\">speed history</a> &middot; " +
      "same reasoning as <code>pxa-launch --explain</code> &middot; refreshes every 3s &middot; " +
      "read-only, off the hot path.";
  }

  function tick() {
    fetch("/pxa/explain", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(render)
      .catch(function (e) {
        document.getElementById("err").textContent = "Could not read /pxa/explain: " + e.message;
      });
  }

  tick();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
